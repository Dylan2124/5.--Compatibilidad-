# Configuracion del servidor
server.port=8085
spring.application.name=ms-compatibilidad

# Configuracion de base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/db_compatibilidad?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Deshabilitar advertencias de Open-In-View
spring.jpa.open-in-view=false
